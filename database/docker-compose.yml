# Legado: Mongo isolado em database/data. Preferível usar o compose na raiz do repositório
# (make setup && make up) com volume ./data/db e rede rpg-network.
services:
  mongodb:
    image: mongo:7
    container_name: rpg-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rpg
    volumes:
      - ./data:/data/db
    restart: unless-stopped
